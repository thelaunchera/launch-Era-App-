<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Access Reset</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF8F3;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(420px,calc(100% - 36px));background:#fff;border:1px solid #ded8ce;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(25,25,25,.08)}
.mark{width:52px;height:52px;border-radius:16px;background:#191919;color:#F2D85B;display:grid;place-items:center;font-weight:900;margin-bottom:18px}
h1{font-size:30px;line-height:1.05;margin:0 0 10px}p{color:#6f6a63;line-height:1.55;margin:0 0 20px}
button{width:100%;border:0;border-radius:999px;background:#191919;color:#fff;padding:14px 18px;font-weight:900;font-size:16px}
small{display:block;margin-top:12px;color:#8a857d}
</style>
</head>
<body>
<div class="card">
  <div class="mark">TLE</div>
  <h1>Restableciendo tu acceso de admin…</h1>
  <p>Voy a limpiar la sesión vieja del navegador y abrir la app con <strong>dailinsegura17@gmail.com</strong>.</p>
  <button id="go">Continuar como Admin</button>
  <small>No borra clientes, trabajos ni datos del negocio.</small>
</div>
<script>
(function(){
  const ADMIN="dailinsegura17@gmail.com";
  function reset(){
    try{
      for(let i=localStorage.length-1;i>=0;i--){
        const key=localStorage.key(i);
        if(!key) continue;
        if(key.includes("auth-token") || key==="tle_last_admin_email" || key==="tle_admin_emails"){
          localStorage.removeItem(key);
        }
      }
      sessionStorage.clear();
      localStorage.setItem("tle_last_admin_email",ADMIN);
      localStorage.setItem("tle_admin_emails",JSON.stringify([ADMIN]));
      location.replace("./?admin=1&fresh=20260927-2");
    }catch(e){
      location.replace("./?admin=1&fresh=20260927-2");
    }
  }
  document.getElementById("go").addEventListener("click",reset);
  setTimeout(reset,700);
})();
</script>
</body>
</html>
