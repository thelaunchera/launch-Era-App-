name: Cleaning App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cleaning-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Block high/critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Prevent tracked secret leakage
        shell: bash
        run: |
          if git grep -nE 'sk_live_|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|hook\.us2\.make\.com' -- ':!vendor/**' ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "Sensitive backend credential or webhook pattern found in tracked repository files."
            exit 1
          fi
      - run: npm run check
      - run: npm run verify-local-supabase
      - run: npm run repo-health
      - run: npm run smoke
      - run: npm run browser-smoke

  cross-browser:
    name: Cross-browser release gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: node cross-browser-smoke.mjs
      - run: node public-booking-smoke.mjs
      - run: node dashboard-bento-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-bento-layout
          path: test-results/bento/
          retention-days: 7
